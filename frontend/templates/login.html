<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project CARE - Login Portal</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
        }

        .test-hints {
            font-size: 12px;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="login-box card">
        <h2 style="margin-bottom: 8px; color: var(--primary);">Project CARE</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px;">Complaint Assignment & Resolution Engine</p>
        
        <form id="loginForm">
            <label>User ID (e.g., STU-2026-001)</label>
            <input type="text" id="userId" required placeholder="Enter your ID">
            
            <label>Password</label>
            <input type="password" id="password" required placeholder="••••••••">
            
            <button type="submit" style="width: 100%;">Sign In</button>
        </form>

        <div id="errorMsg" style="color: var(--danger); font-size: 13px; margin-top: 10px;"></div>

        <div class="test-hints">
            <strong>Quick Test Credentials:</strong><br>
            • Student: <code>STU-2026-001</code> | <code>pass123</code><br>
            • Staff: <code>STF-101</code> | <code>pass123</code><br>
            • Admin: <code>ADM-01</code> | <code>admin123</code>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const user_id = document.getElementById('userId').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');

    errorMsg.innerText = "";

    try {
        const response = await fetch('http://127.0.0.1:8000/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id, password })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Login failed');

        // Store user details in localStorage
        localStorage.setItem('care_user', JSON.stringify(data));

        // Role-based redirects
        if (data.role === 'STUDENT') {
            window.location.href = 'student_dashboard.html';
        } else if (data.role === 'STAFF') {
            window.location.href = 'staff_workspace.html';
        } else if (data.role === 'ADMIN') {
            window.location.href = 'admin_dashboard.html';
        }
    } catch (err) {
        errorMsg.innerText = err.message;
    }
});
    </script>
</body>
</html>
